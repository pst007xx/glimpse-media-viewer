name: image2-viewer
base: core24
version: '1.0'
title: Image2-Viewer
summary: View, tag and organise your photos and videos
description: |
  Image2-Viewer is a fast, simple image viewer and organiser that fits right into GNOME.
  Open a photo and every image and video in its folder is ready to browse in the sidebar.

  **View**
  * Thumbnails of every image and video in the folder
  * Zoom with buttons, keyboard, Ctrl+scroll or pinch, and drag to pan
  * Play videos in the main window: MP4, MOV, MKV, WebM, AVI and more,
    with H.264, HEVC, VP9 and other common codecs
  * Fullscreen viewing, and JPEG, PNG, WebP, HEIC, AVIF, TIFF, SVG, GIF and other images

  **Organise**
  * Pin your photo folders to the sidebar and drag images onto them to move or copy,
    with undo and Alt+1…9 quick-move keys
  * Copy, move, rename and delete several files at once, to the trash or permanently
  * Set any image as your wallpaper

  **Tag and find**
  * Add, rename and remove tags on one image or many at once; tags are saved in the
    image (XMP and IPTC keywords), so other photo apps can read them too
  * Show only the images with a tag, or sort them by tag
  * Find by Tag searches every pinned folder, even large libraries on external drives

  **More**
  * Properties shows file and camera details: camera, lens, exposure and date taken
  * Open files in another app, or show them in Files

  To use photos on external drives, connect the removable-media interface:
  snap connect image2-viewer:removable-media
grade: stable
confinement: strict
license: GPL-3.0-or-later
contact: https://github.com/pst007xx/Image2-Viewer
website: https://github.com/pst007xx/Image2-Viewer
source-code: https://github.com/pst007xx/Image2-Viewer
issues: https://github.com/pst007xx/Image2-Viewer/issues
icon: icons/io.github.imagery.Image2.svg

apps:
  image2-viewer:
    # runs on core24's own /usr/bin/python3 (snapcraft drops the staged copy as the base has it)
    command: bin/image2
    common-id: io.github.imagery.Image2
    desktop: usr/share/applications/io.github.imagery.Image2.desktop
    # gnome supplies GTK 4, libadwaita and the desktop, wayland, x11, gsettings… plugs
    extensions: [gnome]
    slots:
      - dbus-image2     # lets GApplication own its app ID on the session bus
    plugs:
      - home             # browse and organise images in your home folder
      - removable-media   # /media and /mnt (connect manually: snap connect image2-viewer:removable-media)
      - audio-playback    # sound for videos
    environment:
      PYTHONPATH: $SNAP/usr/lib/python3/dist-packages
      # GTK's own file dialog and drag-and-drop see real paths (with the home plug),
      # so opening an image can show its whole folder. See IN_SNAP in image2.py.
      GDK_DEBUG: no-portals
      # GTK finds its video module (media/libmedia-gstreamer.so, from the video part) here
      GTK_PATH: $SNAP/usr/lib/x86_64-linux-gnu/gtk-4.0

slots:
  dbus-image2:
    interface: dbus
    bus: session
    name: io.github.imagery.Image2

parts:
  image2:
    plugin: nil
    source: .
    stage-packages:
      - python3
      - python3-gi
      - gir1.2-gexiv2-0.10   # Properties: camera details and tags (brings libgexiv2 and libexiv2)
    override-build: |
      craftctl default
      install -Dm755 image2.py "$CRAFT_PART_INSTALL/bin/image2"
      install -Dm644 icons/io.github.imagery.Image2.svg \
        "$CRAFT_PART_INSTALL/usr/share/icons/hicolor/scalable/apps/io.github.imagery.Image2.svg"
      install -Dm644 icons/io.github.imagery.Image2-256.png \
        "$CRAFT_PART_INSTALL/usr/share/icons/hicolor/256x256/apps/io.github.imagery.Image2.png"
      mkdir -p "$CRAFT_PART_INSTALL/usr/share/applications"
      sed -e 's|@EXEC@|image2-viewer|' \
          -e 's|^Icon=.*|Icon=${SNAP}/usr/share/icons/hicolor/scalable/apps/io.github.imagery.Image2.svg|' \
          io.github.imagery.Image2.desktop \
          > "$CRAFT_PART_INSTALL/usr/share/applications/io.github.imagery.Image2.desktop"

  # The GNOME platform has GStreamer but not GTK's GStreamer video module or the libav
  # decoders (H.264, HEVC…, what most cameras and phones record). Keep just those and the
  # libraries the platform lacks: the rest of these packages' dependencies (GTK, GLib,
  # libavcodec…) are already in the platform, and copies here would shadow them.
  video:
    plugin: nil
    stage-packages:
      - libgtk-4-media-gstreamer
      - gstreamer1.0-libav
    prime:
      - usr/lib/*/gtk-4.0/4.0.0/media
      - usr/lib/*/gstreamer-1.0/libgstlibav.so
      - usr/lib/*/libavfilter.so.9*
      - usr/lib/*/libpostproc.so.57*
      - usr/lib/*/libass.so.9*
      - usr/lib/*/libbs2b.so.0*
      - usr/lib/*/libfftw3.so.3*
      - usr/lib/*/libflite*.so.*   # .so.1 links to .so.2.2
      - usr/lib/*/liblilv-0.so.0*
      - usr/lib/*/libmysofa.so.1*
      - usr/lib/*/libplacebo.so.338*
      - usr/lib/*/libpocketsphinx.so.3*
      - usr/lib/*/librubberband.so.2*
      - usr/lib/*/libsamplerate.so.0*
      - usr/lib/*/libserd-0.so.0*
      - usr/lib/*/libsord-0.so.0*
      - usr/lib/*/libsphinxbase.so.3*
      - usr/lib/*/libsratom-0.so.0*
      - usr/lib/*/libunibreak.so.5*
      - usr/lib/*/libvidstab.so.1.1*
      - usr/lib/*/libzimg.so.2*
      - usr/lib/*/libzix-0.so.0*
      - usr/lib/*/blas
      - usr/lib/*/lapack
    # Debian links libblas.so.3 and liblapack.so.3 into place with update-alternatives,
    # which never runs for stage packages
    override-prime: |
      craftctl default
      cd "$CRAFT_PRIME/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR"
      ln -sf blas/libblas.so.3 libblas.so.3
      ln -sf lapack/liblapack.so.3 liblapack.so.3
